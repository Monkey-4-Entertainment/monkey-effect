<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkeyeffect Roulette Overlay</title>
    <script>
      if (new URLSearchParams(location.search).get("embedded") === "1") {
        document.documentElement.classList.add("embedded");
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+Thai:wght@500;600;700&family=Cinzel:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --chroma: #00ff00;
        --overlay-w: 680px;
        --overlay-h: 382px;
        --stage-w: 640px;
        --item-w: 128px;
        --frame-size: 88px;
        --ink: #0c1210;
        --ink-2: #15201a;
        --bronze: #8a6a2f;
        --gold: #e8c46a;
        --gold-bright: #ffe9a8;
        --gold-deep: #b8892d;
        --moss: #1f3d32;
        --leaf: #9fd8b0;
        --ember: #ffb070;
        --lucky-pink: #ff4d8d;
        --lucky-violet: #a855f7;
        --lucky-cyan: #22d3ee;
      }

      html,
      body {
        margin: 0;
        width: var(--overlay-w);
        height: var(--overlay-h);
        overflow: hidden;
        background: var(--chroma);
        background-color: var(--chroma);
        user-select: none;
        font-family: "Noto Sans Thai", "Outfit", sans-serif;
      }
      html.embedded,
      html.embedded body {
        background: transparent !important;
        background-color: transparent !important;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0;
        transform: scale(0.96) translateY(6px);
        transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #root.show {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      #root.win .roulette-result {
        animation: resultReveal 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #root.win .roulette-focus {
        animation: focusWin 0.9s ease-out both;
      }
      #root.spinning .roulette-focus::after {
        animation: portalSpin 1.1s linear infinite;
      }

      .roulette-stage {
        position: relative;
        width: var(--stage-w);
        flex-shrink: 0;
      }

      .roulette-glow {
        position: absolute;
        inset: -28% -16%;
        background:
          radial-gradient(circle at 50% 35%, rgba(232, 196, 106, 0.28), transparent 52%),
          radial-gradient(circle at 50% 70%, rgba(31, 61, 50, 0.35), transparent 60%);
        filter: blur(20px);
        z-index: 0;
        pointer-events: none;
      }

      .roulette-mist {
        position: absolute;
        inset: -8%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 20% 80%, rgba(159, 216, 176, 0.12), transparent 45%),
          radial-gradient(ellipse at 80% 20%, rgba(255, 176, 112, 0.1), transparent 40%);
        animation: mistDrift 6s ease-in-out infinite alternate;
      }

      .roulette-card {
        position: relative;
        z-index: 1;
        padding: 20px 18px 16px;
        text-align: center;
        color: var(--gold-bright);
        border-radius: 22px;
        background:
          linear-gradient(180deg, rgba(48, 38, 18, 0.45) 0%, transparent 18%),
          linear-gradient(165deg, rgba(22, 32, 28, 0.98) 0%, rgba(10, 16, 14, 0.99) 52%, rgba(16, 26, 22, 0.98) 100%);
        box-shadow:
          0 0 0 1px rgba(255, 233, 168, 0.4),
          0 0 0 6px rgba(18, 22, 16, 0.92),
          0 0 0 7px rgba(201, 149, 46, 0.55),
          0 22px 50px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 233, 168, 0.18);
      }

      .roulette-card::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(232, 196, 106, 0.22);
        border-radius: 14px;
        pointer-events: none;
        background:
          linear-gradient(90deg, transparent, rgba(232, 196, 106, 0.1), transparent) top / 100% 1px no-repeat,
          linear-gradient(90deg, transparent, rgba(232, 196, 106, 0.1), transparent) bottom / 100% 1px no-repeat;
      }

      .vault-lantern {
        position: absolute;
        top: 10px;
        width: 18px;
        height: 28px;
        z-index: 3;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 70%, #ffe9a8, #c9952e 55%, #6e4f1a);
        clip-path: polygon(50% 0, 88% 18%, 88% 78%, 50% 100%, 12% 78%, 12% 18%);
        box-shadow: 0 0 16px rgba(255, 233, 168, 0.55);
        animation: lanternGlow 1.8s ease-in-out infinite alternate;
      }
      .vault-lantern.left { left: 28px; }
      .vault-lantern.right { right: 28px; animation-delay: 0.4s; }
      #root.theme-fate .vault-lantern { display: none; }
      .fate-lantern {
        position: absolute;
        top: 12px;
        width: 16px;
        height: 16px;
        z-index: 3;
        pointer-events: none;
        display: none;
        background: linear-gradient(135deg, #ffd0ea, #ff4d8d 50%, #7c3aed);
        transform: rotate(45deg);
        box-shadow: 0 0 16px rgba(255, 77, 109, 0.7);
        animation: lanternGlow 1.6s ease-in-out infinite alternate;
      }
      .fate-lantern.left { left: 30px; }
      .fate-lantern.right { right: 30px; animation-delay: 0.35s; }
      #root.theme-fate .fate-lantern { display: block; }

      .label-row {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 4px 0 12px;
        padding: 0 36px;
      }
      .combo-chip[hidden] {
        display: none !important;
      }
      .combo-chip {
        flex: 0 0 auto;
        min-width: 42px;
        padding: 4px 10px;
        border-radius: 999px;
        font-family: "Cinzel", serif;
        font-weight: 800;
        font-size: 0.85rem;
        letter-spacing: 0.04em;
        color: #1a140c;
        background: linear-gradient(180deg, #ffe9a8, #c9952e);
        box-shadow: 0 4px 12px rgba(201, 149, 46, 0.35);
      }
      .combo-chip.is-on {
        animation: comboPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #root.theme-fate .combo-chip {
        color: #fff;
        background: linear-gradient(135deg, #ff6b9d, #c026d3);
        box-shadow: 0 4px 14px rgba(255, 64, 129, 0.4);
      }

      .roulette-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .roulette-row .roulette-window {
        flex: 1;
        min-width: 0;
      }

      .combo-banner[hidden] {
        display: none !important;
      }
      .combo-banner {
        flex: 0 0 96px;
        position: relative;
        z-index: 6;
        margin: 0;
        padding: 10px 8px 9px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        border-radius: 14px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 233, 168, 0.28), transparent 62%),
          linear-gradient(180deg, rgba(62, 44, 14, 0.55), rgba(18, 16, 10, 0.35));
        border: 1px solid rgba(255, 233, 168, 0.55);
        box-shadow:
          0 0 0 1px rgba(184, 137, 45, 0.35),
          0 8px 22px rgba(232, 196, 106, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }
      .combo-banner.is-on {
        animation: comboRowPop 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .combo-banner-kicker {
        font-family: "Cinzel", serif;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        color: rgba(255, 233, 168, 0.78);
      }
      .combo-banner-n {
        font-family: "Cinzel", serif;
        font-weight: 800;
        font-size: 2.45rem;
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: #fff6d4;
        text-shadow:
          0 0 18px rgba(255, 233, 168, 0.75),
          0 3px 0 rgba(110, 79, 26, 0.55);
      }
      .combo-banner-sub {
        font-family: "Noto Serif Thai", serif;
        font-size: 0.68rem;
        color: rgba(255, 233, 168, 0.72);
        margin-top: 0;
        line-height: 1.1;
      }
      @keyframes comboRowPop {
        0% { opacity: 0; transform: scale(0.5) translateX(-20px); }
        55% { transform: scale(1.1) translateX(4px); }
        100% { opacity: 1; transform: scale(1) translateX(0); }
      }

      .ornament {
        position: absolute;
        width: 22px;
        height: 22px;
        z-index: 2;
        pointer-events: none;
      }
      .ornament::before,
      .ornament::after {
        content: "";
        position: absolute;
        background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
      }
      .ornament::before {
        width: 10px;
        height: 10px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
        box-shadow: 0 0 10px rgba(232, 196, 106, 0.45);
      }
      .ornament::after {
        width: 4px;
        height: 4px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
        background: #1a1410;
      }
      .ornament.tl { top: 2px; left: 2px; }
      .ornament.tr { top: 2px; right: 2px; }
      .ornament.bl { bottom: 2px; left: 2px; }
      .ornament.br { bottom: 2px; right: 2px; }

      .roulette-crest {
        position: relative;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        margin-bottom: 6px;
      }
      .roulette-crest-line {
        width: min(220px, 70%);
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
        opacity: 0.7;
      }
      .roulette-badge {
        font-family: "Cinzel", "Noto Serif Thai", serif;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        color: var(--gold-bright);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
        padding: 2px 4px;
      }
      .roulette-badge-sub {
        font-family: "Noto Serif Thai", serif;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: rgba(232, 196, 106, 0.65);
        text-transform: uppercase;
      }

      .roulette-label {
        position: relative;
        z-index: 1;
        font-size: 0.98rem;
        font-weight: 600;
        color: #f5eedc;
        margin: 0;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
        min-width: 0;
      }

      .roulette-frame {
        position: relative;
        z-index: 1;
        padding: 14px 12px;
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(201, 149, 46, 0.22), rgba(21, 32, 26, 0.35)),
          linear-gradient(90deg, rgba(159, 216, 176, 0.12), transparent 28%, transparent 72%, rgba(232, 196, 106, 0.14));
        border: 1px solid rgba(232, 196, 106, 0.42);
        box-shadow:
          inset 0 0 0 1px rgba(0, 0, 0, 0.28),
          inset 0 12px 28px rgba(0, 0, 0, 0.22);
      }

      .roulette-frame-corner {
        position: absolute;
        width: 18px;
        height: 18px;
        z-index: 3;
        border-color: var(--gold);
        border-style: solid;
        border-width: 0;
        opacity: 0.9;
      }
      .roulette-frame-corner.tl {
        top: 4px; left: 4px;
        border-top-width: 2px; border-left-width: 2px;
      }
      .roulette-frame-corner.tr {
        top: 4px; right: 4px;
        border-top-width: 2px; border-right-width: 2px;
      }
      .roulette-frame-corner.bl {
        bottom: 4px; left: 4px;
        border-bottom-width: 2px; border-left-width: 2px;
      }
      .roulette-frame-corner.br {
        bottom: 4px; right: 4px;
        border-bottom-width: 2px; border-right-width: 2px;
      }

      .roulette-window {
        position: relative;
        height: calc(var(--frame-size) + 72px);
        min-height: 156px;
        max-height: 268px;
        overflow: hidden;
        border-radius: 14px;
        border: 1px solid rgba(232, 196, 106, 0.28);
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255, 233, 168, 0.14), transparent 55%),
          linear-gradient(180deg, #141c16 0%, #0a100e 55%, #121c17 100%);
        box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.55);
      }

      .roulette-window::before,
      .roulette-window::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42px;
        z-index: 5;
        pointer-events: none;
      }
      .roulette-window::before {
        left: 0;
        background: linear-gradient(90deg, rgba(8, 12, 10, 0.92), transparent);
      }
      .roulette-window::after {
        right: 0;
        background: linear-gradient(270deg, rgba(8, 12, 10, 0.92), transparent);
      }

      .roulette-strip {
        display: flex;
        align-items: center;
        height: 100%;
        will-change: transform;
      }

      .roulette-item {
        flex: 0 0 var(--item-w);
        width: var(--item-w);
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 8px;
        color: #f3ebd6;
        box-sizing: border-box;
      }

      .roulette-item-frame {
        width: var(--frame-size);
        height: var(--frame-size);
        border-radius: 18px;
        padding: 4px;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(145deg, #fff3c4 0%, #e8c46a 28%, #c9952e 58%, #6e4f1a 100%);
        box-shadow:
          0 8px 16px rgba(0, 0, 0, 0.45),
          0 0 14px rgba(232, 196, 106, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        box-sizing: border-box;
      }
      .roulette-item-frame::after {
        content: "";
        position: absolute;
        inset: -20% -60%;
        background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.45) 50%, transparent 65%);
        animation: gemShine 2.4s ease-in-out infinite;
        pointer-events: none;
      }

      .roulette-item-frame-inner {
        width: 100%;
        height: 100%;
        border-radius: 14px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 28%, #3d5a48, #101814 72%);
        border: 1px solid rgba(20, 16, 8, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
      }

      .roulette-item-frame-inner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .roulette-item-fallback {
        font-family: "Cinzel", serif;
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--gold);
      }

      .roulette-item-caption {
        max-width: calc(var(--item-w) - 10px);
        font-size: 0.74rem;
        font-weight: 600;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #1a140c;
        text-shadow: none;
        background: linear-gradient(180deg, #ffe9a8, #d4a84a);
        padding: 3px 8px;
        border-radius: 999px;
      }
      #root.theme-fate:not(.phase-mult) .roulette-item-frame {
        background: linear-gradient(145deg, #ffd6ec 0%, #ff6aa8 38%, #c026d3 68%, #6d28d9 100%);
        box-shadow:
          0 8px 16px rgba(0, 0, 0, 0.45),
          0 0 16px rgba(255, 64, 129, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }
      #root.theme-fate:not(.phase-mult) .roulette-item-frame-inner {
        background: radial-gradient(circle at 50% 28%, #5b2148, #140814 72%);
      }
      #root.theme-fate:not(.phase-mult) .roulette-item-caption {
        color: #fff;
        background: linear-gradient(180deg, #ff8ab8, #a21caf);
        padding: 3px 8px;
        text-shadow: none;
      }
      #root.phase-mult .roulette-item-caption {
        color: rgba(255, 245, 250, 0.95);
        background: transparent;
        padding: 0;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
      }

      .roulette-pointer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 2px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, transparent 4%, var(--gold-bright), var(--gold-deep), transparent 96%);
        z-index: 4;
        opacity: 0.85;
      }
      .roulette-pointer::before,
      .roulette-pointer::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        filter: drop-shadow(0 0 6px rgba(232, 196, 106, 0.55));
      }
      .roulette-pointer::before {
        top: 0;
        border-top: 11px solid var(--gold);
      }
      .roulette-pointer::after {
        bottom: 0;
        border-bottom: 11px solid var(--gold);
      }

      .roulette-focus {
        position: absolute;
        top: 7px;
        bottom: 7px;
        left: 50%;
        width: var(--item-w);
        transform: translateX(-50%);
        border-radius: 18px;
        border: 1.5px solid rgba(255, 233, 168, 0.88);
        box-shadow:
          0 0 0 1px rgba(138, 106, 47, 0.45),
          0 0 22px rgba(232, 196, 106, 0.28),
          inset 0 0 18px rgba(232, 196, 106, 0.1);
        z-index: 3;
        box-sizing: border-box;
        overflow: hidden;
      }
      .roulette-focus::after {
        content: "";
        position: absolute;
        inset: -40%;
        background: conic-gradient(
          from 0deg,
          transparent 0deg,
          rgba(255, 233, 168, 0.18) 40deg,
          transparent 80deg,
          transparent 180deg,
          rgba(159, 216, 176, 0.12) 220deg,
          transparent 260deg
        );
        opacity: 0;
      }

      .roulette-sparks {
        position: absolute;
        inset: 0;
        z-index: 6;
        pointer-events: none;
        opacity: 0;
      }
      #root.win .roulette-sparks {
        opacity: 1;
      }
      .roulette-sparks span {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 1px;
        background: var(--gold-bright);
        box-shadow: 0 0 8px rgba(255, 233, 168, 0.8);
        animation: sparkFly 0.85s ease-out both;
      }

      .roulette-footer {
        margin-top: 8px;
        padding: 0 2px;
      }

      .roulette-result {
        position: relative;
        z-index: 1;
        margin-top: 0;
        min-height: 1.25em;
        padding: 8px 10px;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.35;
        color: var(--leaf);
        text-shadow: 0 0 14px rgba(159, 216, 176, 0.25);
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.12));
      }
      .roulette-result::before {
        content: "✦";
        margin-right: 6px;
        color: var(--gold);
        font-size: 0.85em;
      }
      .roulette-result::after {
        content: "✦";
        margin-left: 6px;
        color: var(--gold);
        font-size: 0.85em;
      }

      @keyframes comboPop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes lanternGlow {
        from { filter: brightness(0.9); box-shadow: 0 0 10px rgba(255, 233, 168, 0.35); }
        to { filter: brightness(1.25); box-shadow: 0 0 22px rgba(255, 233, 168, 0.7); }
      }
      @keyframes gemShine {
        0% { transform: translateX(-30%); opacity: 0; }
        20% { opacity: 0.7; }
        55% { transform: translateX(40%); opacity: 0; }
        100% { transform: translateX(40%); opacity: 0; }
      }
      @keyframes mistDrift {
        from { transform: translateY(0) scale(1); opacity: 0.85; }
        to { transform: translateY(-6px) scale(1.04); opacity: 1; }
      }
      @keyframes portalSpin {
        to { transform: rotate(360deg); opacity: 0.55; }
      }
      @keyframes focusWin {
        0% { box-shadow: 0 0 0 1px rgba(138, 106, 47, 0.45), 0 0 18px rgba(232, 196, 106, 0.2); }
        40% { box-shadow: 0 0 0 2px rgba(255, 233, 168, 0.9), 0 0 36px rgba(232, 196, 106, 0.55); }
        100% { box-shadow: 0 0 0 1px rgba(138, 106, 47, 0.45), 0 0 22px rgba(232, 196, 106, 0.28); }
      }
      @keyframes resultReveal {
        from { opacity: 0; transform: translateY(8px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes sparkFly {
        0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
      }

      /* ===== Lucky Monkey — modern glass UI ===== */
      #root.theme-fate .roulette-crest {
        margin-bottom: 2px;
      }
      #root.theme-fate .label-row {
        margin: 2px 0 8px;
      }
      #root.theme-fate .roulette-glow {
        inset: -22% -10%;
        background:
          radial-gradient(circle at 28% 18%, rgba(255, 77, 141, 0.55), transparent 42%),
          radial-gradient(circle at 72% 78%, rgba(34, 211, 238, 0.35), transparent 48%),
          radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.28), transparent 58%);
        filter: blur(24px);
        animation: luckyGlowPulse 3.2s ease-in-out infinite alternate;
      }
      #root.theme-fate .roulette-mist {
        background:
          radial-gradient(ellipse at 12% 88%, rgba(255, 77, 141, 0.16), transparent 42%),
