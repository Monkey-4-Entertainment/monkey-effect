<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkeyeffect Jar Overlay</title>
    <style>
      html, body, #stage, #chroma {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #00ff00;
        background-color: #00ff00;
      }
      html, body { position: fixed; inset: 0; user-select: none; }
      #chroma { position: absolute; inset: 0; z-index: 0; }
      #fx { position: absolute; inset: 0; z-index: 2; display: block; }
      #hud {
        position: absolute;
        left: 50%;
        bottom: 2.4%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 7px;
        pointer-events: none;
        font-family: "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
        background: #2b2b2b;
        border-radius: 999px;
        padding: 5px 14px 5px 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,.28);
      }
      #hud .coin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, #fff4a8, #ffd84a 42%, #e6b000 78%, #c48a00);
        box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 1px 2px rgba(0,0,0,.35);
        position: relative;
      }
      #hud .coin::after {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        border: 1.5px solid rgba(180, 110, 0, .45);
      }
      #hud b {
        color: #ffe44a;
        font-size: 22px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.02em;
        text-shadow: 0 1px 0 rgba(0,0,0,.35);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="chroma"></div>
      <canvas id="fx"></canvas>
      <div id="hud"><span class="coin"></span><b id="hudCount">0</b></div>
    </div>
    <script src="/vendor/matter.min.js?v=019"></script>
    <script src="/jar-overlay.js?v=jar50"></script>
  </body>
</html>
