<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkeyeffect Jar Overlay</title>
    <style>
      html, body, #stage, #chroma {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #00ff00;
        background-color: #00ff00;
      }
      html, body { position: fixed; inset: 0; user-select: none; }
      #chroma { position: absolute; inset: 0; z-index: 0; }
      #fx { position: absolute; inset: 0; z-index: 2; display: block; }
      #hud {
        position: absolute;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 8px;
        pointer-events: none;
        font-family: "Segoe UI", "Leelawadee UI", Tahoma, sans-serif;
      }
      #hud .stack {
        width: 28px;
        height: 22px;
        position: relative;
      }
      #hud .stack i {
        position: absolute;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe9a0, #e2b13a 55%, #b8860b);
        border: 1px solid rgba(80, 50, 0, .45);
        box-shadow: 0 1px 0 rgba(255,255,255,.35) inset;
      }
      #hud .stack i:nth-child(1) { left: 0; top: 2px; }
      #hud .stack i:nth-child(2) { left: 8px; top: 0; }
      #hud b {
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        -webkit-text-stroke: 4px #111;
        paint-order: stroke fill;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="chroma"></div>
      <canvas id="fx"></canvas>
      <div id="hud"><span class="stack"><i></i><i></i></span><b id="hudCount">0</b></div>
    </div>
    <script src="/vendor/matter.min.js?v=019"></script>
    <script src="/jar-overlay.js?v=jar47"></script>
  </body>
</html>
