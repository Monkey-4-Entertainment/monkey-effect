<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monkeyeffect Video Overlay</title>
    <script>
      if (new URLSearchParams(location.search).get("embedded") === "1") {
        document.documentElement.classList.add("embedded");
      }
    </script>
    <style>
      :root {
        --chroma: #00ff00;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--chroma);
        background-color: var(--chroma);
        user-select: none;
      }
      html.embedded,
      html.embedded body,
      html.mode-clear,
      body.mode-clear {
        background: transparent !important;
        background-color: transparent !important;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        pointer-events: none;
      }
      #player {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #view {
        width: 100%;
        height: 100%;
        display: none;
        pointer-events: none;
      }
      #view.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <video id="player" playsinline autoplay></video>
      <canvas id="view" aria-hidden="true"></canvas>
    </div>
    <script src="/overlay.js?v=video-queue-fix2"></script>
  </body>
</html>
